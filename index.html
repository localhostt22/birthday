<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Her Story</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="film">

        <!-- Film grain -->
        <div class="grain"></div>

        <!-- Dark vignette -->
        <div class="vignette"></div>

        <!-- Main opening -->
        <main class="opening">

            <p class="eyebrow">
                A STORY WORTH REMEMBERING
            </p>

            <div class="opening-text">

                <h1 class="line line-one">
                    Some stories are written...
                </h1>

                <h1 class="line line-two">
                    Some are lived.
                </h1>

            </div>

            <!-- CHANGE HER NAME -->
            <h2 class="name">
                saniya 
            </h2>

            <p class="subtitle">
                This is her story
            </p>

            <button id="beginBtn" class="begin-btn">
                Begin
            </button>

        </main>

    </div>


    <!-- Transition to next chapter -->
    <div id="transition" class="transition"></div>


    <script src="script.js"></script>

</body>
</html>
