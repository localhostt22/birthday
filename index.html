<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Her Story</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #000;
        }

        body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: #f3eee6;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =========================
           THE THEATRE
        ========================= */

        .film {
            --bar: clamp(36px, 9vh, 110px);   /* letterbox bar height */

            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: radial-gradient(circle at center, #191919 0%, #090909 45%, #000 100%);
        }

        .film.leaving {
            pointer-events: none;
        }

        .glow {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 5s ease;
            background: radial-gradient(
                ellipse 45% 40% at 50% 50%,
                rgba(255, 232, 200, 0.07) 0%,
                transparent 70%
            );
        }

        .film.running .glow { opacity: 1; }

        .vignette {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 30%,
                rgba(0, 0, 0, 0.8) 100%
            );
        }

        .dust {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 4s ease;
            mix-blend-mode: screen;
        }

        .film.running .dust { opacity: 1; }


        /* =========================
           THE MEMORIES
           Her photographs, dimmed, in
           front of a blurred copy of
           themselves. Never cropped,
           never stretched.
        ========================= */

        .montage {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .shot {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .shot.on { opacity: 1; }

        .shot .bgi {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.2);
            filter: blur(46px) brightness(0.35) saturate(0.8);
        }

        .shot .ph {
            position: absolute;
            left: 50%;
            top: 50%;
            width: auto;
            height: 76vh;
            max-width: 70vw;
            object-fit: contain;
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(0.7) contrast(1.05) saturate(0.75);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
            transition: transform 3.2s ease-out;
        }

        .shot.on .ph {
            transform: translate(-50%, -50%) scale(1);
        }


        /* =========================
           LETTERBOX
        ========================= */

        .bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: calc(50% + 1px);
            background: #000;
            z-index: 4;
            pointer-events: none;
            transition: height 3.2s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .bar.top    { top: 0; }
        .bar.bottom { bottom: 0; }

        .film.open .bar { height: var(--bar); }

        .film.leaving .bar {
            height: calc(50% + 1px);
            transition-duration: 1.6s;
        }


        /* =========================
           EFFECTS
        ========================= */

        .streak {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            margin-top: -1px;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transform: scaleX(0);
            mix-blend-mode: screen;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(150, 190, 255, 0) 5%,
                rgba(195, 218, 255, 0.95) 50%,
                rgba(150, 190, 255, 0) 95%,
                transparent 100%
            );
            box-shadow: 0 0 18px 4px rgba(140, 180, 255, 0.45);
        }

        .streak.fire { animation: streak 1.6s ease-out forwards; }

        @keyframes streak {
            0%   { opacity: 0; transform: scaleX(0); }
            30%  { opacity: 1; }
            60%  { opacity: 0.8; transform: scaleX(1); }
            100% { opacity: 0; transform: scaleX(1.1); }
        }

        .leak {
            position: absolute;
            inset: -10%;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            background:
                radial-gradient(ellipse 60% 80% at 15% 50%, rgba(255, 170, 80, 0.95) 0%, rgba(255, 100, 40, 0.55) 35%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 40% 90%, rgba(255, 210, 150, 0.6), transparent 70%);
        }

        .leak.fire { animation: leak 2.4s ease-in-out forwards; }

        @keyframes leak {
            0%   { opacity: 0; transform: translateX(-35%); }
            40%  { opacity: 1; }
            100% { opacity: 0; transform: translateX(30%); }
        }

        .flicker {
            position: absolute;
            inset: 0;
            z-index: 8;
            background: #000;
            opacity: 0;
            pointer-events: none;
        }

        .film.running.fx-flicker .flicker { animation: flicker 5.3s infinite; }

        @keyframes flicker {
            0%    { opacity: 0; }
            4%    { opacity: 0.07; }
            5%    { opacity: 0; }
            22%   { opacity: 0.04; }
            23%   { opacity: 0.09; }
            24%   { opacity: 0.01; }
            47%   { opacity: 0; }
            48%   { opacity: 0.06; }
            50%   { opacity: 0; }
            71%   { opacity: 0.05; }
            72%   { opacity: 0; }
            88%   { opacity: 0.08; }
            89.5% { opacity: 0.02; }
            100%  { opacity: 0; }
        }

        .grain {
            position: absolute;
            width: 200%;
            height: 200%;
            left: -50%;
            top: -50%;
            z-index: 10;
            pointer-events: none;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            animation: grainMove 0.25s steps(2) infinite;
        }

        @keyframes grainMove {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-2%, 2%); }
            50%  { transform: translate(2%, -2%); }
            75%  { transform: translate(1%, 3%); }
            100% { transform: translate(-2%, -1%); }
        }


        /* =========================
           THE GATE
           One quiet screen so the
           music can start with a tap.
        ========================= */

        .gate {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            background: #000;
            border: none;
            cursor: pointer;
            color: rgba(243, 238, 230, 0.7);
            font-family: Arial, Helvetica, sans-serif;
            transition: opacity 1.8s ease, color 0.4s ease;
        }

        .gate.out {
            opacity: 0;
            pointer-events: none;
        }

        .gate:hover,
        .gate:focus-visible {
            color: #fff;
            outline: none;
        }

        .ring {
            width: 46px;
            height: 46px;
            border: 1px solid rgba(243, 238, 230, 0.4);
            border-radius: 50%;
            animation: breathe 3.2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1);    opacity: 0.8; }
            50%      { transform: scale(1.28); opacity: 0.25; }
        }

        .gate-main {
            font-size: 10px;
            letter-spacing: 7px;
            text-transform: uppercase;
            padding-left: 7px;
        }

        .gate-sub {
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(243, 238, 230, 0.4);
            padding-left: 4px;
        }


        /* =========================
           OPENING
        ========================= */

        .opening {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--bar) 20px;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .film.leaving .opening { opacity: 0; }

        .eyebrow {
            position: absolute;
            top: calc(var(--bar) / 2);
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(243, 238, 230, 0.55);
            opacity: 0;
            transition: opacity 3s ease, letter-spacing 4s ease;
        }

        .film.show-eyebrow .eyebrow {
            opacity: 1;
            letter-spacing: 7px;
        }

        .stack {
            display: grid;
            place-items: center;
            width: 100%;
        }

        .scene {
            grid-area: 1 / 1;
            text-align: center;
            width: 100%;
        }


        /* ---- SCENE 1: the two lines ---- */

        .scene-lines { transition: opacity 2s ease, filter 2s ease; }

        .film.lines-out .scene-lines {
            opacity: 0;
            filter: blur(6px);
        }

        .line {
            font-size: clamp(25px, 5vw, 58px);
            font-weight: 400;
            line-height: 1.3;
            color: #f3eee6;
            text-shadow: 0 3px 25px rgba(0, 0, 0, 0.75);
            opacity: 0;
            transform: translateY(26px);
            filter: blur(8px);
            transition: opacity 2.4s ease, transform 2.4s ease, filter 2.4s ease;
        }

        .film.show-l1 .line-one,
        .film.show-l2 .line-two {
            opacity: 1;
            transform: none;
            filter: blur(0);
        }

        .line-two { margin-top: 6px; }


        /* ---- SCENE 2: the days / the thought ---- */

        .scene-two { transition: opacity 2s ease, filter 2s ease; }

        .film.two-out .scene-two {
            opacity: 0;
            filter: blur(6px);
        }

        .t-small {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: rgba(243, 238, 230, 0.55);
            padding-left: 7px;
        }

        .t-big {
            margin: 22px 0;
            font-size: clamp(64px, 15vw, 170px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.02em;
            color: #f3eee6;
            text-shadow: 0 0 40px rgba(255, 235, 205, 0.14), 0 3px 25px rgba(0, 0, 0, 0.7);
        }

        /* when there is no day-count, the big line is a sentence */
        .t-big.words {
            font-size: clamp(25px, 4.4vw, 52px);
            line-height: 1.3;
            letter-spacing: 0;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .t-tail {
            max-width: 700px;
            margin: 26px auto 0;
            font-size: clamp(18px, 2.4vw, 28px);
            font-style: italic;
            line-height: 1.5;
            color: rgba(243, 238, 230, 0.85);
            text-shadow: 0 3px 25px rgba(0, 0, 0, 0.75);
        }

        .t-small,
        .t-big,
        .t-tail {
            opacity: 0;
            transform: translateY(22px);
            filter: blur(8px);
            transition: opacity 2.2s ease, transform 2.2s ease, filter 2.2s ease;
        }

        .film.show-t-lead .t-lead,
        .film.show-t-big  .t-big,
        .film.show-t-unit .t-unit,
        .film.show-t-tail .t-tail {
            opacity: 1;
            transform: none;
            filter: blur(0);
        }


        /* ---- SCENE 3: the name ---- */

        .name {
            padding-left: 0.22em;
            font-size: clamp(45px, 11vw, 115px);
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #f3eee6;
            text-shadow: 0 0 40px rgba(255, 235, 205, 0.18), 0 3px 25px rgba(0, 0, 0, 0.7);
            opacity: 0;
            filter: blur(10px);
            transform: scale(0.97);
            transition:
                opacity 3.5s ease,
                filter 3.5s ease,
                transform 4.5s ease,
                letter-spacing 4.5s ease,
                padding-left 4.5s ease;
        }

        .film.show-name .name {
            opacity: 1;
            filter: blur(0);
            transform: scale(1);
            letter-spacing: 0.11em;
            padding-left: 0.11em;
        }

        .subtitle {
            margin-top: 28px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(243, 238, 230, 0.5);
            opacity: 0;
            transition: opacity 2.4s ease;
        }

        .film.show-sub .subtitle { opacity: 1; }


        /* =========================
           BEGIN (lives in the bottom bar)
        ========================= */

        .begin-wrap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--bar);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .begin-btn {
            display: inline-block;
            padding: 0 0 6px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(243, 238, 230, 0.35);
            border-radius: 0;
            color: rgba(243, 238, 230, 0.75);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10px;
            letter-spacing: 6px;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition:
                opacity 2s ease,
                visibility 0s linear 2s,
                color 0.4s ease,
                border-color 0.4s ease;
        }

        .begin-btn span {
            display: inline-block;
            transition: transform 0.4s ease;
        }

        .film.show-begin .begin-btn {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition:
                opacity 2s ease,
                visibility 0s,
                color 0.4s ease,
                border-color 0.4s ease;
        }

        .begin-btn:hover,
        .begin-btn:focus-visible {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.8);
            outline: none;
        }

        .begin-btn:hover span,
        .begin-btn:focus-visible span { transform: translateX(6px); }


        /* =========================
           NARROW / PORTRAIT SCREENS
        ========================= */

        @media not all and (min-width: 900px), not all and (min-aspect-ratio: 5/4) {

            .shot .ph {
                height: 72vh;
                max-width: 85vw;
            }
        }

        @media (max-width: 600px) {

            .eyebrow { font-size: 8px; }
            .film.show-eyebrow .eyebrow { letter-spacing: 4px; }

            .subtitle { letter-spacing: 4px; }
            .begin-btn { letter-spacing: 4px; }
            .t-small { letter-spacing: 5px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .grain, .ring { animation: none; }
        }

    </style>
</head>

<body>

    <div class="film" id="film">

        <!-- Her photographs, built by the script -->
        <div class="montage" id="montage" aria-hidden="true"></div>

        <div class="glow"></div>

        <!-- Dust in the light -->
        <canvas class="dust" id="dust" aria-hidden="true"></canvas>

        <!-- Dark vignette -->
        <div class="vignette"></div>

        <!-- Letterbox -->
        <div class="bar top"></div>
        <div class="bar bottom"></div>

        <!-- Main opening -->
        <main class="opening">

            <p class="eyebrow">
                A STORY WORTH REMEMBERING
            </p>

            <div class="stack">

                <div class="scene scene-lines">

                    <h1 class="line line-one">
                        Some stories are written...
                    </h1>

                    <h1 class="line line-two">
                        Some are lived.
                    </h1>

                </div>

                <div class="scene scene-two">
                    <p class="t-small t-lead" id="tLead"></p>
                    <h2 class="t-big" id="tBig"></h2>
                    <p class="t-small t-unit" id="tUnit"></p>
                    <p class="t-tail" id="tTail"></p>
                </div>

                <div class="scene scene-name">

                    <!-- CHANGE HER NAME -->
                    <h2 class="name">
                        Saniya
                    </h2>

                    <p class="subtitle">
                        This is her story
                    </p>

                </div>

            </div>

            <div class="begin-wrap">
                <button id="beginBtn" class="begin-btn">
                    Begin <span>→</span>
                </button>
            </div>

        </main>

        <div class="streak" id="streak"></div>
        <div class="leak" id="leak"></div>
        <div class="flicker"></div>
        <div class="grain"></div>

        <!-- One tap to start the film (and the music) -->
        <button class="gate" id="gate" type="button">
            <span class="ring"></span>
            <span class="gate-main">Tap to begin</span>
            <span class="gate-sub">sound on &middot; headphones recommended</span>
        </button>

    </div>


    <!-- the opening always starts fresh; chapters pick the music up -->
    <script>window.BF_NO_RESUME = true;</script>
    <script src="music.js"></script>

    <script>

    (function () {

        /* =========================================
           MAKE IT HERS — edit these
        ========================================= */

        // The day you got together, as YYYY-MM-DD. The film then counts the
        // days up on screen. Leave as "" to use the two lines below instead.
        const SINCE = "";

        // Photographs shown in the memory montage, in order.
        // Names must match assets/photos exactly (capitals included).
        const MONTAGE = [
            "childhood-1.jpg",
            "growing-up-1.jpg",
            "growing-up-2.jpg",
            "growing-up-3.jpg",
            "chapter5-1.jpg",
            "chapter5-3.jpg",
            "chapter5-2.jpg"
        ];

        // The words (rewrite them in your own voice)
        const COPY = {
            lead:  "It has been",
            unit:  "days",
            tail:  "and I would choose every single one of them again.",

            // used when SINCE is empty
            altBig:  "Out of every story that could have happened,",
            altTail: "I'm so glad it was this one."
        };


        /* =========================================
           EFFECTS — switch any of these off (false)
        ========================================= */

        const FX = {
            dust:      true,
            scratches: true,
            flicker:   true,
            leak:      true,
            streak:    true
        };

        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) Object.keys(FX).forEach(k => FX[k] = false);

        // while testing: open index.html?fast to play at 4x speed
        let speed = 1;
        if (window.location.search.indexOf("fast") !== -1) speed = 0.25;

        const M = window.BirthdayMusic;

        const film    = document.getElementById("film");
        const gate    = document.getElementById("gate");
        const streak  = document.getElementById("streak");
        const leak    = document.getElementById("leak");
        const begin   = document.getElementById("beginBtn");
        const montage = document.getElementById("montage");

        if (FX.flicker) film.classList.add("fx-flicker");

        function at(seconds, fn) {
            setTimeout(fn, seconds * 1000 * speed);
        }

        function fire(el) {
            el.classList.remove("fire");
            void el.offsetWidth;
            el.classList.add("fire");
        }


        /* =========================================
           PRELOAD HER PHOTOGRAPHS (while the gate waits)
        ========================================= */

        const loadedPhotos = [];

        const preloaded = Promise.all(MONTAGE.map(function (name, order) {
            return new Promise(function (resolve) {
                const img = new Image();
                img.onload  = function () { loadedPhotos.push({ name: name, order: order }); resolve(); };
                img.onerror = function () { resolve(); };     // missing photo: just skip it
                img.src = "assets/photos/" + name;
            });
        }));

        function buildShots() {
            const shots = [];
            loadedPhotos
                .sort(function (a, b) { return a.order - b.order; })
                .forEach(function (p) {
                    const src = "assets/photos/" + p.name;
                    const shot = document.createElement("div");
                    shot.className = "shot";
                    shot.innerHTML =
                        '<img class="bgi" src="' + src + '" alt="">' +
                        '<img class="ph" src="' + src + '" alt="">';
                    montage.appendChild(shot);
                    shots.push(shot);
                });
            return shots;
        }


        /* =========================================
           DUST
        ========================================= */

        function startDust() {

            const canvas = document.getElementById("dust");
            const ctx = canvas.getContext("2d");
            let w = 0, h = 0;
            const parts = [];

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = canvas.clientWidth;
                h = canvas.clientHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function make(initial) {
                return {
                    x: Math.random() * w,
                    y: initial ? Math.random() * h : h + 10,
                    r: 0.4 + Math.random() * 1.6,
                    vx: (Math.random() - 0.5) * 0.12,
                    vy: -(0.03 + Math.random() * 0.16),
                    a: 0.1 + Math.random() * 0.35,
                    p: Math.random() * 6.28,
                    s: 0.4 + Math.random() * 1.2,
                    glow: Math.random() < 0.2
                };
            }

            resize();
            window.addEventListener("resize", resize);

            const count = w < 700 ? 35 : 70;
            for (let i = 0; i < count; i++) parts.push(make(true));

            function frame(t) {
                ctx.clearRect(0, 0, w, h);

                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];

                    p.x += p.vx + Math.sin(t / 4000 * p.s + p.p) * 0.05;
                    p.y += p.vy;

                    if (p.y < -10) parts[i] = make(false);

                    const alpha = p.a * (0.6 + 0.4 * Math.sin(t / 900 * p.s + p.p));

                    ctx.beginPath();
                    ctx.fillStyle = "rgba(255, 240, 215, " + alpha + ")";

                    if (p.glow) {
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = "rgba(255, 230, 190, 0.6)";
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.arc(p.x, p.y, p.r, 0, 6.2832);
                    ctx.fill();
                }

                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
        }

        function scratchLoop() {
            setTimeout(function () {

                const s = document.createElement("div");
                const tall = 60 + Math.random() * 40;

                s.style.cssText =
                    "position:absolute;z-index:8;pointer-events:none;width:1px;" +
                    "left:" + (Math.random() * 100) + "%;" +
                    "top:" + (Math.random() * (100 - tall)) + "%;" +
                    "height:" + tall + "%;" +
                    "background:rgba(255,255,255," + (0.12 + Math.random() * 0.15) + ");";

                film.appendChild(s);
                setTimeout(function () { s.remove(); }, 90);

                scratchLoop();

            }, (1500 + Math.random() * 2500) * speed);
        }


        /* =========================================
           THE DAYS
        ========================================= */

        function prepareSceneTwo() {

            const lead = document.getElementById("tLead");
            const big  = document.getElementById("tBig");
            const unit = document.getElementById("tUnit");
            const tail = document.getElementById("tTail");

            let days = NaN;
            if (SINCE) {
                days = Math.floor((Date.now() - new Date(SINCE + "T00:00:00").getTime()) / 86400000);
            }

            if (isFinite(days) && days > 0) {
                lead.textContent = COPY.lead;
                unit.textContent = COPY.unit;
                tail.textContent = COPY.tail;
                big.textContent  = "0";
                return { counting: true, days: days, big: big };
            }

            // no date given: a sentence instead of a number
            big.classList.add("words");
            big.textContent  = COPY.altBig;
            tail.textContent = COPY.altTail;
            lead.style.display = "none";
            unit.style.display = "none";
            return { counting: false };
        }

        function countUp(el, to, ms) {
            const t0 = performance.now();
            function f(now) {
                const p = Math.min(1, (now - t0) / ms);
                const e = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(to * e).toLocaleString();
                if (p < 1) requestAnimationFrame(f);
            }
            requestAnimationFrame(f);
        }


        /* =========================================
           THE FILM (seconds after the tap)
        ========================================= */

        function playScene() {

            const two   = prepareSceneTwo();
            const shots = buildShots();

            // 0.8   a thin line of light in the dark
            at(0.8, function () { if (FX.streak) fire(streak); });

            // 1.2   the aperture opens
            at(1.2, function () {
                film.classList.add("open", "running");
                if (FX.dust) startDust();
                if (FX.scratches) scratchLoop();
            });

            // 3.2   title strip
            at(3.2, function () { film.classList.add("show-eyebrow"); });

            // 4.4   the two lines (the music gets a little warmer)
            at(4.4, function () {
                film.classList.add("show-l1");
                if (M) M.level(1);
            });
            at(6.8, function () { film.classList.add("show-l2"); });
            at(10.2, function () { film.classList.add("lines-out"); });

            // 11.2  the days
            at(11.2, function () { film.classList.add("show-t-lead"); });
            at(12.2, function () {
                film.classList.add("show-t-big");
                if (two.counting) countUp(two.big, two.days, 3200 * speed);
            });
            at(15.4, function () { film.classList.add("show-t-unit"); });
            at(16.4, function () { film.classList.add("show-t-tail"); });
            at(20.4, function () { film.classList.add("two-out"); });

            // 21.4  her memories, the music opens up
            const mStart = 21.4;
            const gap    = 1.2;
            const mEnd   = shots.length ? mStart + shots.length * gap + 0.4 : mStart;

            if (shots.length) {

                at(mStart - 0.2, function () { if (M) M.level(2); });

                shots.forEach(function (shot, i) {
                    at(mStart + i * gap, function () {
                        if (i > 0) shots[i - 1].classList.remove("on");
                        shot.classList.add("on");
                    });
                });

                // the build
                at(mEnd - 4.4, function () { if (M) M.swell(4.2); });

                // last memory burns away into black
                at(mEnd - 1.0, function () {
                    if (FX.leak) fire(leak);
                });
                at(mEnd - 0.4, function () {
                    shots[shots.length - 1].classList.remove("on");
                });
            }

            // the hit, and her name
            const nameT = mEnd + 0.8;

            at(nameT - 0.2, function () { if (M) M.hit(); });
            at(nameT, function () {
                film.classList.add("show-name");
                if (FX.streak) fire(streak);
            });

            // settle
            at(nameT + 3.4, function () {
                film.classList.add("show-sub");
                if (M) M.level(1);
            });

            // the way in
            at(nameT + 5.2, function () { film.classList.add("show-begin"); });
        }


        /* =========================================
           THE TAP
        ========================================= */

        let started = false;

        gate.addEventListener("click", function () {
            if (started) return;
            started = true;

            if (M) M.start();               // music begins, inside the tap

            gate.classList.add("out");
            setTimeout(function () { gate.style.display = "none"; }, 2000);

            // start as soon as the photographs are ready (never wait more than 4s)
            Promise.race([
                preloaded,
                new Promise(function (r) { setTimeout(r, 4000); })
            ]).then(playScene);
        });


        /* =========================================
           BEGIN: light burn, aperture closes,
           then Chapter I (the music carries on)
        ========================================= */

        begin.addEventListener("click", function () {
            if (FX.leak) fire(leak);
            film.classList.add("leaving");

            setTimeout(function () {
                window.location.href = "chapters/chapter1.html";
            }, 1900);
        });

        window.addEventListener("pageshow", function (e) {
            if (e.persisted) film.classList.remove("leaving");
        });

    })();

    </script>
