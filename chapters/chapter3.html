<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chapter III — And Then There Was Us</title>

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================== */

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background: #000;
            color: #fff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =========================
           CHAPTER
        ========================== */

        .chapter {
            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at center,
                    #211d1d 0%,
                    #0d0b0b 55%,
                    #000 100%
                );
        }


        /* =========================
           BACKGROUND
        ========================== */

        .background-image {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            filter:
                brightness(0.30)
                saturate(0.65)
                contrast(1.05)
                blur(2px);

            transform: scale(1.06);

            opacity: 0;

            transition:
                opacity 1.8s ease,
                transform 8s ease;
        }


        .background-image.visible {
            opacity: 0.40;

            transform: scale(1.02);
        }


        /* =========================
           DARK OVERLAY
        ========================== */

        .darkness {
            position: absolute;

            inset: 0;

            z-index: 2;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.86) 0%,
                    rgba(0,0,0,0.52) 42%,
                    rgba(0,0,0,0.18) 72%,
                    rgba(0,0,0,0.62) 100%
                );
        }


        /* =========================
           BOTTOM FADE
        ========================== */

        .bottom-fade {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 45%;

            z-index: 3;

            background:
                linear-gradient(
                    to top,
                    rgba(0,0,0,0.94),
                    transparent
                );
        }


        /* =========================
           VIGNETTE
        ========================== */

        .vignette {
            position: absolute;

            inset: 0;

            z-index: 10;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 28%,
                    rgba(0,0,0,0.82) 100%
                );
        }


        /* =========================
           GRAIN
        ========================== */

        .grain {
            position: absolute;

            width: 200%;
            height: 200%;

            left: -50%;
            top: -50%;

            z-index: 30;

            pointer-events: none;

            opacity: 0.055;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");

            animation:
                grainMove 0.25s steps(2) infinite;
        }


        @keyframes grainMove {

            0% {
                transform: translate(0,0);
            }

            25% {
                transform: translate(-2%,2%);
            }

            50% {
                transform: translate(2%,-2%);
            }

            75% {
                transform: translate(1%,3%);
            }

            100% {
                transform: translate(-2%,-1%);
            }
        }


        /* =========================
           CHAPTER NUMBER
        ========================== */

        .chapter-number {
            position: absolute;

            top: 52px;
            left: 7%;

            z-index: 20;

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 6px;

            color:
                rgba(255,255,255,0.62);
        }


        /* =========================
           CONTENT
        ========================== */

        .content {
            position: relative;

            z-index: 15;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;

            padding-left: 7%;
            padding-right: 7%;
        }


        /* =========================
           TEXT
        ========================== */

        .text {
            width: 48%;

            padding-top: 30px;
        }


        .eyebrow {
            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 6px;

            color:
                rgba(255,255,255,0.58);

            margin-bottom: 28px;

            opacity: 0;

            transform: translateY(20px);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }


        h1 {
            font-size:
                clamp(45px, 6vw, 78px);

            font-weight: 400;

            line-height: 1;

            letter-spacing: -2px;

            max-width: 680px;

            opacity: 0;

            transform: translateY(30px);

            transition:
                opacity 1.2s ease,
                transform 1.2s ease;
        }


        .description {
            margin-top: 34px;

            max-width: 520px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            line-height: 1.85;

            color:
                rgba(255,255,255,0.60);

            opacity: 0;

            transform: translateY(20px);

            transition:
                opacity 1.2s ease,
                transform 1.2s ease;
        }


        .description.second {
            margin-top: 18px;

            color:
                rgba(255,255,255,0.42);
        }


        /* =========================
           SIDE TEXT
        ========================== */

        .side-text {
            position: absolute;

            right: 7%;

            /*
             * Moved upward so it never
             * overlaps the CONTINUE button.
             */
            bottom: 15%;

            z-index: 16;

            max-width: 260px;

            text-align: right;

            font-family: Arial, sans-serif;

            font-size: 10px;

            line-height: 1.9;

            letter-spacing: 2px;

            text-transform: uppercase;

            color:
                rgba(255,255,255,0.42);

            opacity: 0;

            transition:
                opacity 1.2s ease;
        }


        /* =========================
           PHOTO
        ========================== */

        .photo {
            position: absolute;

            z-index: 14;

            right: 25%;

            top: 50%;

            width:
                min(31vw, 390px);

            height:
                min(72vh, 620px);

            overflow: hidden;

            transform:
                translate(50%, -50%)
                scale(0.94);

            opacity: 0;

            transition:
                opacity 1.6s ease,
                transform 1.8s ease;
        }


        .photo.visible {
            opacity: 1;

            transform:
                translate(50%, -50%)
                scale(1);
        }


        .photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            border: none;
            outline: none;

            filter:
                brightness(0.82)
                contrast(1.04)
                saturate(0.88);
        }


        /* =========================
           ACTIVE STATE
        ========================== */

        .content.active .eyebrow {
            opacity: 1;

            transform: translateY(0);
        }


        .content.active h1 {
            opacity: 1;

            transform: translateY(0);
        }


        .content.active .description {
            opacity: 1;

            transform: translateY(0);
        }


        .content.active .side-text {
            opacity: 1;
        }


        /* =========================
           CHANGING
        ========================== */

        .changing .eyebrow,
        .changing h1,
        .changing .description,
        .changing .side-text {

            opacity: 0;

            transform:
                translateY(20px);
        }


        .changing .photo {

            opacity: 0;

            transform:
                translate(50%, -50%)
                scale(0.94);
        }


        /* =========================
           CONTINUE BUTTON
           HIDDEN BY DEFAULT
        ========================== */

        .continue-button {

            position: absolute;

            right: 7%;

            /*
             * Clearly below side text.
             */
            bottom: 5%;

            z-index: 25;

            padding:
                15px 32px;

            border:
                1px solid
                rgba(255,255,255,0.35);

            color:
                rgba(255,255,255,0.82);

            text-decoration: none;

            font-family:
                Arial,
                sans-serif;

            font-size: 10px;

            font-weight: 500;

            letter-spacing: 5px;

            background:
                rgba(0,0,0,0.20);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transform:
                translateY(10px);

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease,
                background 0.4s ease,
                border-color 0.4s ease,
                color 0.4s ease,
                transform 0.4s ease;
        }


        /* =========================
           FINAL MEMORY
        ========================== */

        .continue-button.visible {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            transform:
                translateY(0);
        }


        .continue-button:hover {

            background:
                rgba(255,255,255,0.08);

            border-color:
                rgba(255,255,255,0.75);

            color: white;

            transform:
                translateY(-3px);
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            .content {

                padding-left: 8%;
                padding-right: 8%;
            }


            .text {

                width: 100%;

                align-self: flex-end;

                padding-bottom: 8%;
            }


            h1 {

                font-size:
                    clamp(40px, 11vw, 64px);
            }


            .photo {

                right: 50%;

                top: 36%;

                width: 48vw;

                height: 52vh;
            }


            .side-text {

                display: none;
            }


            .continue-button {

                right: 8%;

                bottom: 5%;

                padding:
                    13px 24px;

                font-size: 9px;
            }
        }

    </style>

</head>


<body>

<main class="chapter">


    <!-- =========================
         BACKGROUND
    ========================== -->

    <img
        id="backgroundImage"
        class="background-image"
        src="../assets/photos/chapter3-1.jpg"
        alt=""
    >


    <div class="darkness"></div>

    <div class="bottom-fade"></div>


    <!-- =========================
         CHAPTER NUMBER
    ========================== -->

    <div class="chapter-number">
        CHAPTER III
    </div>


    <!-- =========================
         CONTENT
    ========================== -->

    <section
        id="content"
        class="content"
    >


        <!-- =========================
             STORY TEXT
        ========================== -->

        <div class="text">

            <div
                id="eyebrow"
                class="eyebrow"
            >
                AND SOMEWHERE ALONG THE WAY
            </div>


            <h1 id="title">
                She became someone I wanted to know.
            </h1>


            <p
                id="description"
                class="description"
            >
                Not the little girl from those old photographs anymore.
                She had become her own person.
            </p>


            <p
                id="description2"
                class="description second"
            >
                And somehow, I wanted to know the person behind that smile.
            </p>

        </div>


        <!-- =========================
             PHOTO
        ========================== -->

        <div
            id="photo"
            class="photo"
        >

            <img
                id="photoImage"
                src="../assets/photos/chapter3-1.jpg"
                alt="A memory"
            >

        </div>


        <!-- =========================
             SIDE TEXT
        ========================== -->

        <div
            id="sideText"
            class="side-text"
        >
            HER WORLD.<br>
            HER STORIES.<br>
            AND THEN...
        </div>


        <!-- =========================
             CONTINUE
             ONLY FINAL MEMORY
        ========================== -->

        <a
            href="chapter4.html"
            id="continueButton"
            class="continue-button"
        >
            CONTINUE
        </a>


    </section>


    <!-- =========================
         GRAIN
    ========================== -->

    <div class="grain"></div>


    <!-- =========================
         VIGNETTE
    ========================== -->

    <div class="vignette"></div>


</main>


<script>

    /* =========================================
       CHAPTER III — OUR STORY
    ========================================= */


    const memories = [

        /* =========================
           MEMORY 1
        ========================== */

        {
            image:
                "../assets/photos/chapter3-1.jpg",

            eyebrow:
                "AND SOMEWHERE ALONG THE WAY",

            title:
                "She became someone I wanted to know.",

            description:
                "Not the little girl from those old photographs anymore. She had become her own person.",

            description2:
                "And somehow, I wanted to know the person behind that smile.",

            side:
                "HER WORLD.<br>HER STORIES.<br>AND THEN..."
        },


        /* =========================
           MEMORY 2
        ========================== */

        {
            image:
                "../assets/photos/chapter3-2.jpg",

            eyebrow:
                "A LITTLE CLOSER",

            title:
                "She had her own little world.",

            description:
                "Her own stories. Her own chaos. Her own way of making ordinary moments feel different.",

            description2:
                "And somehow, I wanted to become a part of it.",

            side:
                "HER LAUGHTER.<br>HER CHAOS.<br>HER WAY OF LIFE."
        },


        /* =========================
           MEMORY 3 — FINAL
        ========================== */

        {
            image:
                "../assets/photos/chapter3-3.jpg",

            eyebrow:
                "I DIDN'T KNOW IT THEN",

            title:
                "She was becoming my favorite part of the story.",

            description:
                "I didn't know where our story would go. I didn't know how many memories we'd make.",

            description2:
                "I just knew that being around her felt like something worth holding onto.",

            side:
                "SOME STORIES<br>ARE PLANNED.<br>OURS WASN'T."
        }

    ];


    /* =========================================
       ELEMENTS
    ========================================== */

    const content =
        document.getElementById("content");

    const backgroundImage =
        document.getElementById("backgroundImage");

    const photoImage =
        document.getElementById("photoImage");

    const photo =
        document.getElementById("photo");

    const eyebrow =
        document.getElementById("eyebrow");

    const title =
        document.getElementById("title");

    const description =
        document.getElementById("description");

    const description2 =
        document.getElementById("description2");

    const sideText =
        document.getElementById("sideText");

    const continueButton =
        document.getElementById("continueButton");


    let currentMemory = 0;

    let slideshowFinished = false;


    /* =========================================
       CONTINUE BUTTON
       
       ONLY SHOW AFTER PHOTO 3
    ========================================== */

    function updateContinueButton() {

        if (
            currentMemory === memories.length - 1 &&
            slideshowFinished
        ) {

            continueButton.classList.add("visible");

        } else {

            continueButton.classList.remove("visible");

        }
    }


    /* =========================================
       INITIAL REVEAL
    ========================================== */

    setTimeout(() => {

        content.classList.add("active");

        photo.classList.add("visible");

        backgroundImage.classList.add("visible");

        updateContinueButton();

    }, 500);


    /* =========================================
       CHANGE MEMORY
    ========================================== */

    function changeMemory() {

        /*
         * IMPORTANT:
         * If we're already on the final photo,
         * DO NOT START AGAIN FROM PHOTO 1.
         */

        if (
            currentMemory >= memories.length - 1
        ) {

            slideshowFinished = true;

            updateContinueButton();

            return;
        }


        /*
         * Fade everything out.
         */

        content.classList.remove("active");

        photo.classList.remove("visible");

        backgroundImage.classList.remove("visible");

        continueButton.classList.remove("visible");


        /*
         * Wait for fade-out.
         */

        setTimeout(() => {


            /*
             * Move forward ONE photo only.
             */

            currentMemory =
                currentMemory + 1;


            const memory =
                memories[currentMemory];


            /*
             * Change image.
             */

            photoImage.src =
                memory.image;

            backgroundImage.src =
                memory.image;


            /*
             * Change story.
             */

            eyebrow.innerHTML =
                memory.eyebrow;

            title.innerHTML =
                memory.title;

            description.innerHTML =
                memory.description;

            description2.innerHTML =
                memory.description2;

            sideText.innerHTML =
                memory.side;


            /*
             * Reveal new memory.
             */

            content.classList.add("active");

            photo.classList.add("visible");

            backgroundImage.classList.add("visible");


            /*
             * FINAL PHOTO
             */

            if (
                currentMemory === memories.length - 1
            ) {

                /*
                 * Give Photo 3 time to appear
                 * before showing CONTINUE.
                 */

                setTimeout(() => {

                    slideshowFinished = true;

                    updateContinueButton();

                }, 1800);

            }


        }, 900);

    }


    /* =========================================
       EVERY 7 SECONDS
       
       STOPS AFTER PHOTO 3
    ========================================== */

    const slideshow =
        setInterval(() => {

            if (
                currentMemory >= memories.length - 1
            ) {

                clearInterval(slideshow);

                slideshowFinished = true;

                updateContinueButton();

                return;
            }


            changeMemory();

        }, 7000);


</script>

</body>

</html>
