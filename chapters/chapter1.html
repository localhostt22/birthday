<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <title>Chapter I — Before I Knew You</title>

    <!-- The sketchbook look (note: lowercase file name, it matters on web hosts) -->
    <script src="../sketch.js"></script>

    <style>

        /* Everything shared (film, bars, lamp, dust, sheet, pencil, text styles)
           comes from sketch.js. Only this chapter's layout lives here. */

        .stage {
            position: absolute;
            inset: var(--bar) 0;
            z-index: 8;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: 4vw;
            padding: 0 7vw;
            pointer-events: none;
        }

        .copy {
            display: grid;
            max-width: 520px;
        }

        .copy > div {
            grid-area: 1 / 1;
            align-self: center;
        }

        /* the box the photograph sheet must fit inside */
        .zone {
            align-self: stretch;
            margin: 3vh 0;
        }

        .memory {
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(13px, 1.5vw, 20px);
            letter-spacing: 6px;
            line-height: 2.2;
            text-transform: uppercase;
            color: #fff3dc;
            text-shadow: 0 0 30px rgba(255, 170, 90, .35), 0 3px 18px rgba(0, 0, 0, .6);
        }

        .memory .gold { color: #ffc65a; display: block; }

        a.next-chapter { text-decoration: none; }

        /* two blurred colour washes, one per photograph */
        .bgi { opacity: 0; }
        .film.painting .bgi.on { opacity: .55; }
        .film.painting .bgi:not(.on) { opacity: 0; }

        @media (max-width: 760px) {
            .stage {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 1fr) auto;
                gap: 2vh;
                padding: 1vh 7vw;
            }
            .zone { order: -1; margin: 1vh 0; }
            .copy { max-width: none; min-height: 30vh; }
            .title { font-size: clamp(32px, 9vw, 48px); }
            .desc { font-size: 13px; line-height: 1.7; margin-top: 16px; }
            .memory { letter-spacing: 3px; }
        }

    </style>

</head>


<body>

<div class="film" id="film">

    <!-- The colour of each photograph seeps into the room -->
    <div class="backdrop" aria-hidden="true">
        <img class="bgi" id="bg1" src="../assets/photos/childhood-1.jpg" alt="">
        <img class="bgi" id="bg2" src="../assets/photos/childhood-2.jpg" alt="">
    </div>

    <div class="lamp"></div>
    <canvas class="dust" id="dust" aria-hidden="true"></canvas>

    <!-- The sketched photographs are drawn into this layer -->
    <div class="layer" id="layer"></div>

    <div class="vignette"></div>
    <div class="bar top"></div>
    <div class="bar bottom"></div>

    <div class="stage">

        <div class="copy">

            <div id="t1">
                <div class="eyebrow pop" id="eyebrow">A LONG TIME AGO</div>

                <h1 class="title" id="title"></h1>

                <svg class="uline" id="uline" viewBox="0 0 380 16" aria-hidden="true">
                    <path pathLength="1" d="M4 10 C 90 2, 180 14, 260 6 S 350 8, 376 5"/>
                </svg>

                <p class="desc pop" id="desc">
                    Long before I knew her name,
                    before I knew her smile,
                    before I knew that one day
                    she would mean so much to me...
                </p>
            </div>

            <div id="t2">
                <div class="memory">
                    <span class="pop" id="m1">Somewhere along the way...</span>
                    <span class="pop gold" id="m2">She started growing up.</span>
                </div>
            </div>

        </div>

        <div class="zone" id="zone"></div>

    </div>

    <div class="content">

        <div class="chapter-number">CHAPTER I</div>

        <div class="continue-wrap">
            <a class="next-chapter" id="continueLink" href="chapter2.html">
                Continue the story <span>→</span>
            </a>
        </div>

    </div>

    <div class="grain"></div>

</div>


<script>

(function () {

    var film  = document.getElementById("film");
    var link  = document.getElementById("continueLink");
    var $     = function (id) { return document.getElementById(id); };
    var show  = function (id) { $(id).classList.add("in"); };
    var hide  = function (id) { $(id).classList.remove("in"); };

    /* ---- safety net: if sketch.js ever fails to load, the chapter
            still plays as a simple, readable page ---- */

    var BF = window.BFSketch;

    if (!BF) {
        $("title").textContent = "She was just a little girl.";
        film.classList.add("open", "running", "show-chapter", "show-continue");
        ["eyebrow", "desc", "title", "uline"].forEach(show);
        $("title").classList.add("in");
        return;
    }

    var SP = BF.speed;                        // 0.25 with ?fast on the address
    function at(s, fn) { setTimeout(fn, s * 1000 * SP); }

    BF.words($("title"), "She was just a little girl.");

    var layer = $("layer");
    var zone  = $("zone");

    if (!BF.reduce) BF.dust($("dust"));

    /* the two photographs, each with its own little doodles */

    var sheet1 = BF.sheet(layer, zone, "../assets/photos/childhood-1.jpg", {
        rot: -2.2, exit: -1, alt: "Saniya as a child",
        doodles: [
            { shape: "heart", x: 101, y: 5,  s: 46, c: "coral", r: 12,  d: 0.1 },
            { shape: "star",  x: -2,  y: 94, s: 38, c: "gold",  r: -10, d: 0.5 },
            { shape: "spark", x: 103, y: 90, s: 32, c: "cream", r: 0,   d: 0.9 }
        ]
    });

    var sheet2 = BF.sheet(layer, zone, "../assets/photos/childhood-2.jpg", {
        rot: 1.8, exit: 1, alt: "Saniya growing up",
        doodles: [
            { shape: "spark", x: -3,  y: 6,  s: 40, c: "gold",  r: 0,  d: 0.1 },
            { shape: "heart", x: 102, y: 95, s: 44, c: "pink",  r: -8, d: 0.5 },
            { shape: "loop",  x: 100, y: 3,  s: 46, c: "cream", r: 10, d: 0.9 }
        ]
    });


    /* =========================================
       THE SCENE (seconds)
    ========================================= */

    function play() {

        // 0.3  the lights come up, the bars open
        at(0.3, function () { film.classList.add("open", "running"); });
        at(2.4, function () { film.classList.add("show-chapter"); });

        // 1.6  the first sheet of paper lands
        at(1.6, function () { sheet1.enter(); });

        // 2.4  the pencil starts, and the words arrive while it draws
        at(2.6, function () {
            sheet1.draw(8000, function () {

                // colour blooms into the drawing
                $("bg1").classList.add("on");
                film.classList.add("painting");

                sheet1.paint(4500, function () { sheet1.doodles(); });
            });
        });

        at(3.4,  function () { show("eyebrow"); });
        at(4.4,  function () { show("title"); $("title").classList.add("in"); });
        at(6.0,  function () { show("uline"); });
        at(7.2,  function () { show("desc"); });

        // 19.5  the first photograph is tossed aside
        at(19.5, function () {
            film.classList.add("hiding");
            hide("eyebrow"); hide("desc"); hide("uline");
            $("title").classList.remove("in");
            $("bg1").classList.remove("on");
            sheet1.exit();
        });

        // 21  the second one lands
        at(21.0, function () { film.classList.remove("hiding"); sheet2.enter(); });

        at(22.0, function () {
            sheet2.draw(6500, function () {
                $("bg2").classList.add("on");
                sheet2.paint(4000, function () { sheet2.doodles(); });
            });
        });

        // the second line
        at(23.0, function () { show("m1"); });
        at(26.0, function () { show("m2"); });

        // 34  the way forward
        at(34.0, function () { film.classList.add("show-continue"); });
    }


    /* wait for the photographs so the film never starts on a blank frame */

    var started = false;

    function start() {
        if (started) return;
        started = true;
        requestAnimationFrame(function () { requestAnimationFrame(play); });
    }

    Promise.all([sheet1.ready, sheet2.ready]).then(start);
    setTimeout(start, 5000);                  // slow connection safety net


    /* =========================================
       Leaving: the paper fades, the bars close
    ========================================= */

    link.addEventListener("click", function (e) {
        e.preventDefault();
        film.classList.add("leaving");
        setTimeout(function () {
            window.location.href = link.getAttribute("href");
        }, 1700);
    });

    window.addEventListener("pageshow", function (e) {
        if (e.persisted) film.classList.remove("leaving");
    });

})();

</script>

<script src="../music.js"></script>

</body>
</html>
