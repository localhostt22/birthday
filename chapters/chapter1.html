<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chapter I — Before I Knew You</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #000;

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =========================
           FILM
        ========================= */

        .film {

            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #222 0%,
                    #0b0b0b 50%,
                    #000 100%
                );
        }


        /* =========================
           PHOTO CONTAINER
        ========================= */

        .photo-container {

            position: absolute;

            inset: 0;

            overflow: hidden;

            z-index: 1;
        }


        /* =========================
           PHOTOS
           KEEPING PORTRAIT
           DIMENSIONS
        ========================= */

        .photo {

            position: absolute;

            width: auto;

            height: 76vh;

            max-width: 70vw;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1.03);

            object-fit: contain;

            opacity: 0;

            transition:
                opacity 2s ease,
                transform 9s ease;

            filter:
                brightness(0.68)
                contrast(1.05)
                saturate(0.75);
        }


        .photo.active {

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }


        /* =========================
           CINEMATIC GRADIENT
        ========================= */

        .cinematic {

            position: absolute;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:

                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.35) 0%,
                    rgba(0,0,0,0.05) 40%,
                    rgba(0,0,0,0.20) 65%,
                    rgba(0,0,0,0.90) 100%
                );
        }


        /* =========================
           VIGNETTE
        ========================= */

        .vignette {

            position: absolute;

            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 35%,
                    rgba(0,0,0,0.80) 100%
                );
        }


        /* =========================
           FILM GRAIN
        ========================= */

        .grain {

            position: absolute;

            width: 200%;

            height: 200%;

            left: -50%;

            top: -50%;

            z-index: 10;

            pointer-events: none;

            opacity: 0.075;

            background-image:

                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");

            animation:
                grainMove 0.25s steps(2) infinite;
        }


        @keyframes grainMove {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-2%, 2%);
            }

            50% {
                transform: translate(2%, -2%);
            }

            75% {
                transform: translate(1%, 3%);
            }

            100% {
                transform: translate(-2%, -1%);
            }
        }


        /* =========================
           STORY CONTENT
        ========================= */

        .content {

            position: relative;

            z-index: 5;

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            padding:

                0
                clamp(35px, 7vw, 100px)
                clamp(70px, 10vh, 100px);

            pointer-events: none;
        }


        /* =========================
           CHAPTER LABEL
        ========================= */

        .chapter {

            position: absolute;

            top: 8%;

            left: clamp(35px, 7vw, 100px);

            font-family: Arial, sans-serif;

            font-size: 9px;

            letter-spacing: 6px;

            color:
                rgba(255,255,255,0.55);

            text-transform: uppercase;

            opacity: 0;

            animation:
                fadeIn 2s ease forwards;

            animation-delay: 0.8s;
        }


        /* =========================
           TEXT
        ========================= */

        .text {

            max-width: 650px;

            margin-bottom: 30px;
        }


        .eyebrow {

            font-family: Arial, sans-serif;

            font-size: 9px;

            letter-spacing: 5px;

            text-transform: uppercase;

            color:
                rgba(255,255,255,0.55);

            margin-bottom: 20px;

            opacity: 0;

            animation:
                fadeUp 2s ease forwards;

            animation-delay: 1.5s;
        }


        /* =========================
           MAIN TITLE
        ========================= */

        .title {

            font-size:
                clamp(42px, 6vw, 82px);

            font-weight: 400;

            line-height: 0.98;

            color: white;

            text-shadow:
                0 3px 25px rgba(0,0,0,0.75);

            opacity: 0;

            animation:
                fadeUp 2s ease forwards;

            animation-delay: 2s;
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .description {

            max-width: 520px;

            margin-top: 24px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            line-height: 1.8;

            letter-spacing: 0.5px;

            color:
                rgba(255,255,255,0.58);

            opacity: 0;

            animation:
                fadeUp 2s ease forwards;

            animation-delay: 2.7s;
        }


        /* =========================
           SECOND MEMORY TEXT
        ========================= */

        .memory-text {

            position: absolute;

            bottom: 8%;

            right: 7%;

            max-width: 330px;

            text-align: right;

            font-family: Arial, sans-serif;

            font-size: 11px;

            line-height: 1.7;

            letter-spacing: 2px;

            color:
                rgba(255,255,255,0.45);

            opacity: 0;

            transition:
                opacity 2s ease;
        }


        .memory-text.show {

            opacity: 1;
        }


        /* =========================
           FADE ANIMATION
        ========================= */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(35px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .content {

                padding:
                    0
                    25px
                    60px;
            }

            .chapter {

                left: 25px;
            }

            .title {

                font-size: 45px;
            }

            .description {

                font-size: 11px;
            }

            .memory-text {

                display: none;
            }

            .photo {

                height: 72vh;

                max-width: 85vw;
            }
        }

    </style>

</head>


<body>


<div class="film">


    <!-- =========================
         CHILDHOOD PHOTOS
    ========================= -->

    <div class="photo-container">

        <img
            src="../assets/photos/childhood-1.jpg"
            class="photo active"
            id="photo1"
            alt="Saniya as a child"
        >


        <img
            src="../assets/photos/childhood-2.jpg"
            class="photo"
            id="photo2"
            alt="Saniya growing up"
        >

    </div>


    <!-- =========================
         CINEMATIC OVERLAYS
    ========================= -->

    <div class="cinematic"></div>

    <div class="vignette"></div>

    <div class="grain"></div>


    <!-- =========================
         STORY
    ========================= -->

    <div class="content">


        <div class="chapter">

            CHAPTER I

        </div>


        <div class="text">


            <div class="eyebrow">

                A LONG TIME AGO

            </div>


            <h1 class="title">

                She was<br>
                just a little girl.

            </h1>


            <p class="description">

                Long before I knew her name,
                before I knew her smile,
                before I knew that one day
                she would mean so much to me...

            </p>


        </div>


        <div
            class="memory-text"
            id="memoryText"
        >

            SOMEWHERE ALONG THE WAY...<br>

            SHE STARTED GROWING UP.

        </div>


    </div>


</div>



<script>

    /* =================================
       PHOTO TRANSITION
    ================================= */


    const photo1 =
        document.getElementById("photo1");

    const photo2 =
        document.getElementById("photo2");


    const memoryText =
        document.getElementById("memoryText");


    /*
       First childhood photo stays
       on screen for 8 seconds.
    */

    setTimeout(() => {

        photo1.classList.remove("active");

        photo2.classList.add("active");

        memoryText.classList.add("show");

    }, 8000);


    /*
       Fade out after Chapter 1.
    */

    setTimeout(() => {

        document.body.style.transition =
            "opacity 2s ease";

        document.body.style.opacity =
            "0";

    }, 15000);


    /*
       Move to Chapter 2.
    */

    setTimeout(() => {

        window.location.href =
            "chapter2.html";

    }, 17000);


</script>


</body>

</html>
